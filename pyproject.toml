[project]
name = "BusArrivalBot"
version = "0.3.0"
description = "Telegram bot for checking bus arrival times in Singapore"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "apscheduler>=3.11.0",
    "httpx>=0.28.1",
    "python-decouple-typed>=3.11.0",
    "python-telegram-bot>=22.3",
    "scipy>=1.16.1",
]

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "pre-commit>=4.6.2",
    "pytest>=8.4.2",
    "ruff>=0.16.4",
    "ty>=0.0.74",
]
