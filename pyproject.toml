[project]
name = "BusArrivalBot"
version = "0.3.1"
description = "Telegram bot for checking bus arrival times in Singapore"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "apscheduler>=3.11.3",
    "httpx>=0.28.1",
    "python-decouple-typed>=3.11.0",
    "python-telegram-bot>=22.8",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
    "ty>=0.0.81",
]
