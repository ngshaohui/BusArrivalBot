name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - run: uv python install 3.13
      - run: uv sync --locked --all-groups
      - run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - run: docker build -t bus-arrival-bot:ci .

      - name: Show image size
        run: |
          docker images bus-arrival-bot:ci
          docker image inspect bus-arrival-bot:ci \
            --format='{{.Size}}' | numfmt --to=iec

      - name: Show image history
        run: docker history bus-arrival-bot:ci
