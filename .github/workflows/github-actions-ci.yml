name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Set up python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run tests
        run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - run: docker build -t bus-arrival-bot:ci .

      - name: Show image size
        run: |
          docker images bus-arrival-bot:ci
          docker image inspect bus-arrival-bot:ci \
            --format='{{.Size}}' | numfmt --to=iec

      - name: Show image history
        run: docker history bus-arrival-bot:ci
